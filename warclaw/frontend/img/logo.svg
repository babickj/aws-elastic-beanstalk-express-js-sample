<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 48" fill="none">
  <defs>
    <!-- Red-orange gradient matching EdgeRunner brand -->
    <linearGradient id="erGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f05030"/>
      <stop offset="100%" stop-color="#b82010"/>
    </linearGradient>
  </defs>

  <!-- ER geometric mark — vertical bar -->
  <rect x="2" y="6" width="7" height="36" rx="1" fill="url(#erGrad)"/>
  <!-- Bowl top bar -->
  <rect x="9" y="6" width="18" height="6" rx="1" fill="url(#erGrad)"/>
  <!-- Bowl right cap -->
  <polygon points="27,6 32,6 32,22 27,22" fill="url(#erGrad)"/>
  <!-- Bowl mid bar -->
  <rect x="9" y="19" width="18" height="6" rx="1" fill="url(#erGrad)"/>
  <!-- Diagonal leg -->
  <polygon points="27,25 34,25 42,42 35,42" fill="url(#erGrad)"/>
  <!-- Short bottom leg -->
  <rect x="9" y="36" width="7" height="6" rx="1" fill="url(#erGrad)"/>

  <!-- Wordmark: "edge" white, "runner" red-orange -->
  <text x="52" y="34"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="22" font-weight="700" letter-spacing="-0.3"
        fill="#f0ece8">edge</text>
  <text x="97" y="34"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="22" font-weight="700" letter-spacing="-0.3"
        fill="#e8401c">runner</text>

  <!-- Divider line -->
  <rect x="196" y="10" width="1" height="28" rx="0.5" fill="#3a2010" opacity="0.8"/>

  <!-- "AI" tag -->
  <text x="205" y="34"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="18" font-weight="400" letter-spacing="2"
        fill="#888888">AI</text>
</svg>
