<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none">
  <!-- ER geometric mark -->
  <!-- Left vertical bar -->
  <rect x="2" y="6" width="7" height="36" rx="1" fill="#cc2b2b"/>
  <!-- Bowl top bar -->
  <rect x="9" y="6" width="18" height="6" rx="1" fill="#cc2b2b"/>
  <!-- Bowl right curve (angular) -->
  <polygon points="27,6 32,6 32,22 27,22" fill="#cc2b2b"/>
  <!-- Bowl bottom bar -->
  <rect x="9" y="19" width="18" height="6" rx="1" fill="#cc2b2b"/>
  <!-- Diagonal leg: from bowl bottom-right down to bottom-right -->
  <polygon points="27,25 34,25 42,42 35,42" fill="#cc2b2b"/>
  <!-- Short leg left fill -->
  <rect x="9" y="36" width="7" height="6" rx="1" fill="#cc2b2b"/>

  <!-- Wordmark: "edgerunner" -->
  <text x="52" y="34"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="22" font-weight="700" letter-spacing="-0.3"
        fill="#ffffff">edge</text>
  <text x="96" y="34"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="22" font-weight="700" letter-spacing="-0.3"
        fill="#e0e0e0">runner</text>

  <!-- "AI" tag -->
  <text x="202" y="34"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="20" font-weight="400" letter-spacing="1"
        fill="#888888">AI</text>
</svg>
